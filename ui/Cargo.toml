[package]
name        = "flo_ui"
version     = "0.1.0"
edition     = "2024"
authors     = ["Andrew Hunter"]
license     = "Apache-2.0"
repository  = "https://github.com/Logicalshift/flowbetween"
description = "User interface components built for flo_draw/flo_scene"

[dependencies]
flo_draw            = { version = "0.4", features = [ "render-software" ], default-features = false }
flo_render_software = "0.4"

flo_binding         = "3.0"
flo_scene           = "0.3"
flo_scene_binding   = "0.3"
flo_scene_guest     = "0.3"
flo_stream          = "0.7"
flo_curves          = "0.8"

futures             = "0.3"
serde               = { version = "1.0", features = [ "derive" ] }
postcard            = "1.1"
uuid                = { version = "1.0", features = [ "v4", "serde" ] }
egui                = { version = "0.33", default-features = false, features = [ "rayon", "default_fonts" ] }
